services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transactions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transactions}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-transactions}:${POSTGRES_PASSWORD:-transactions}@postgres:5432/${POSTGRES_DB:-transactions}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  mock-provider:
    build:
      context: .
      dockerfile: mock-provider/Dockerfile
    environment:
      MOCK_PORT: "8081"
      MOCK_INITIAL_BALANCE: ${MOCK_INITIAL_BALANCE:-10000.00}
      MOCK_SLOW_DELAY: ${MOCK_SLOW_DELAY:-5s}
    ports:
      - "${MOCK_PROVIDER_PORT:-8081}:8081"

volumes:
  postgres-data:
