services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transactions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transactions}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  mock-provider:
    build:
      context: .
      dockerfile: mock-provider/Dockerfile
    environment:
      MOCK_PORT: "8081"
      MOCK_INITIAL_BALANCE: ${MOCK_INITIAL_BALANCE:-10000.00}
      MOCK_SLOW_DELAY: ${MOCK_SLOW_DELAY:-5s}
    ports:
      - "${MOCK_PROVIDER_PORT:-8081}:8081"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: "8080"
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      DATABASE_URL: postgres://${POSTGRES_USER:-transactions}:${POSTGRES_PASSWORD:-transactions}@postgres:5432/${POSTGRES_DB:-transactions}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-5m}
      RUN_MIGRATIONS: "true"
      PROVIDER_BASE_URL: http://mock-provider:8081
      PROVIDER_REQUEST_TIMEOUT: ${PROVIDER_REQUEST_TIMEOUT:-3s}
      PROVIDER_DIAL_TIMEOUT: ${PROVIDER_DIAL_TIMEOUT:-1s}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
      PROVIDER_RETRY_BASE_DELAY: ${PROVIDER_RETRY_BASE_DELAY:-100ms}
      PROVIDER_RETRY_MAX_DELAY: ${PROVIDER_RETRY_MAX_DELAY:-1s}
      PROVIDER_MAX_IDLE_CONNS: ${PROVIDER_MAX_IDLE_CONNS:-100}
      PROVIDER_MAX_IDLE_CONNS_PER_HOST: ${PROVIDER_MAX_IDLE_CONNS_PER_HOST:-100}
      PROVIDER_IDLE_CONN_TIMEOUT: ${PROVIDER_IDLE_CONN_TIMEOUT:-90s}
      PROVIDER_BREAKER_FAILURE_THRESHOLD: ${PROVIDER_BREAKER_FAILURE_THRESHOLD:-5}
      PROVIDER_BREAKER_OPEN_TIMEOUT: ${PROVIDER_BREAKER_OPEN_TIMEOUT:-30s}
      PROVIDER_BREAKER_HALF_OPEN_MAX_REQUESTS: ${PROVIDER_BREAKER_HALF_OPEN_MAX_REQUESTS:-1}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_started
    stop_grace_period: 20s

volumes:
  postgres-data:
